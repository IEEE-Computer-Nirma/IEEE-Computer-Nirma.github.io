<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Challenges — NovaHack</title>
  <meta name="description" content="NovaHack CTF Challenge Board — IEEE CS Nirma University" />
  <link rel="icon" href="../assets/ieee_cs_emblem.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared.css" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --border: #dddddd;
      --card-bg: #fafafa;
      --hover-bg: #f4f4f4;
      --green: #1a7f37;
      --orange: #FFA300;
      --red: #cf222e;
      --yellow: #9a6700;
      --mono: 'Space Mono', 'Courier New', monospace;
      --sidebar: 260px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV — see shared.css ───────────────── */

    .score-display {
      font-weight: 700;
      font-size: 12px;
    }

    /* ── LAYOUT ────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      flex: 1;
      min-height: 0;
    }

    /* ── SIDEBAR ───────────────────────── */
    .sidebar {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      position: sticky;
      top: 52px;
      height: calc(100vh - 52px);
    }

    .sidebar-section {
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0;
    }

    .sidebar-label {
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.5rem 1.2rem;
    }

    .ch-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      transition: background .1s, color .1s;
      border-left: 3px solid transparent;
    }

    .ch-item:hover {
      background: var(--hover-bg);
      color: var(--fg);
    }

    .ch-item.active {
      background: var(--hover-bg);
      color: var(--fg);
      border-left-color: var(--fg);
    }

    .ch-item.solved {
      color: var(--green);
    }

    .ch-item.solved .ch-dot {
      background: var(--green);
    }

    .ch-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    .ch-pts {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
    }

    .ch-item.solved .ch-pts {
      color: var(--green);
    }

    /* ── MAIN CONTENT ──────────────────── */
    .main {
      overflow-y: auto;
      height: calc(100vh - 52px);
    }

    .main-inner {
      max-width: 780px;
      padding: 3rem 2.5rem;
    }

    /* ── CHALLENGE HEADER ──────────────── */
    .ch-header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .ch-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .ch-icon {
      font-size: 1.2rem;
    }

    .ch-title {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.2;
      margin-bottom: 1.2rem;
    }

    .ch-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border: 1px solid var(--border);
      font-size: 10px;
      letter-spacing: .06em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .badge.easy {
      border-color: var(--green);
      color: var(--green);
    }

    .badge.medium {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .badge.hard {
      border-color: var(--red);
      color: var(--red);
    }

    .badge.solved {
      border-color: var(--green);
      color: var(--green);
      background: #f0fff4;
    }

    /* ── SECTION BLOCKS ────────────────── */
    .block {
      margin-bottom: 2.5rem;
    }

    .block-title {
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .block p {
      font-size: 13px;
      line-height: 1.85;
      color: var(--fg);
    }

    .block p+p {
      margin-top: 0.8rem;
    }

    /* ── HINTS ─────────────────────────── */
    .hint-card {
      border: 1px solid var(--border);
      margin-bottom: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s;
    }

    .hint-card:hover {
      border-color: #aaa;
    }

    .hint-card.revealed {
      border-color: var(--orange);
    }

    .hint-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      background: var(--card-bg);
      user-select: none;
    }

    .hint-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .hint-cost {
      font-size: 10px;
      color: var(--muted);
      margin-left: 8px;
    }

    .hint-arrow {
      font-size: 10px;
      color: var(--muted);
      transition: transform .2s;
    }

    .hint-card.revealed .hint-arrow {
      transform: rotate(180deg);
    }

    .hint-body {
      display: none;
      padding: 1rem;
      border-top: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.8;
      color: var(--fg);
      background: #fffef8;
    }

    .hint-card.revealed .hint-body {
      display: block;
    }

    /* ── CODE BLOCK ────────────────────── */
    .code-wrap {
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .code-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .code-filename {
      color: var(--muted);
      letter-spacing: .04em;
    }

    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 10px;
      cursor: pointer;
      color: var(--muted);
      letter-spacing: .04em;
      transition: all .2s;
    }

    .copy-btn:hover {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }

    pre {
      overflow-x: auto;
      padding: 1.2rem;
      font-size: 12px;
      line-height: 1.6;
      background: var(--bg);
      tab-size: 4;
    }

    code {
      font-family: var(--mono);
    }

    /* ── FLAG SUBMISSION ───────────────── */
    .flag-section {
      border: 1px solid var(--border);
      padding: 1.5rem;
      background: var(--card-bg);
    }

    .flag-title {
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .flag-row {
      display: flex;
      gap: 8px;
    }

    .flag-input {
      flex: 1;
      font-family: var(--mono);
      font-size: 13px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      outline: none;
      transition: border-color .2s;
    }

    .flag-input:focus {
      border-color: var(--fg);
    }

    .flag-input::placeholder {
      color: var(--border);
    }

    .submit-btn {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 9px 20px;
      border: 2px solid var(--fg);
      background: var(--fg);
      color: var(--bg);
      cursor: pointer;
      letter-spacing: .04em;
      transition: all .2s;
    }

    .submit-btn:hover {
      background: transparent;
      color: var(--fg);
    }

    .download-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--fg);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .download-btn:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .flag-result {
      margin-top: 0.8rem;
      font-size: 12px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      display: none;
    }

    .flag-result.correct {
      border-color: var(--green);
      color: var(--green);
      background: #f0fff4;
    }

    .flag-result.wrong {
      border-color: var(--red);
      color: var(--red);
      background: #fff5f5;
    }

    .solved-badge {
      display: inline-block;
      padding: 4px 12px;
      background: var(--green);
      color: white;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* ── WELCOME SCREEN ────────────────── */
    .welcome {
      max-width: 540px;
      padding: 3rem 2.5rem;
    }

    .welcome h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -.02em;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.85;
      margin-bottom: 1rem;
    }

    .welcome code {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1px 6px;
      font-size: 12px;
    }

    .progress-bar-wrap {
      border: 1px solid var(--border);
      height: 6px;
      margin: 2rem 0 0.5rem;
      background: var(--card-bg);
    }

    .progress-bar {
      height: 100%;
      background: var(--fg);
      transition: width .4s;
    }

    .progress-label {
      font-size: 11px;
      color: var(--muted);
    }

    /* ── NEW WELCOME SCREEN ─────────────────── */
    .wlc-root {
      padding: 2.5rem 2.8rem;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    /* Banner */
    .wlc-banner {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wlc-badge {
      display: inline-block;
      background: var(--green);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      padding: 2px 8px;
      animation: wlc-pulse 1.8s ease-in-out infinite;
    }

    @keyframes wlc-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .wlc-banner-text {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Terminal */
    .wlc-terminal {
      background: #111;
      color: #00e676;
      font-family: var(--mono);
      font-size: 14px;
      padding: 1.1rem 1.4rem;
      border: 1px solid #333;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 0;
      border-radius: 2px;
    }

    .wlc-prompt {
      color: #aaa;
      flex-shrink: 0;
    }

    .wlc-cursor {
      color: #00e676;
      animation: wlc-blink .9s steps(1) infinite;
      margin-left: 1px;
    }

    @keyframes wlc-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Stats */
    .wlc-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      border: 1px solid var(--border);
    }

    .wlc-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem .5rem;
      border-right: 1px solid var(--border);
      text-align: center;
    }

    .wlc-stat:last-child { border-right: none; }

    .wlc-stat-val {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .wlc-stat-lbl {
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Progress */
    .wlc-prog-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wlc-prog-bar {
      height: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .wlc-prog-fill {
      height: 100%;
      background: var(--fg);
      transition: width .6s cubic-bezier(.4,0,.2,1);
    }

    .wlc-prog-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    /* Rules */
    .wlc-rules {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid var(--border);
      padding: 1rem 1.2rem;
    }

    .wlc-rule {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wlc-rule code {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1px 5px;
      font-size: 11px;
    }

    .wlc-rule-icon {
      font-size: 13px;
      flex-shrink: 0;
    }

    /* Start button */
    .wlc-start-btn {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      border: 2px solid var(--fg);
      background: var(--fg);
      color: var(--bg);
      padding: 13px 28px;
      cursor: pointer;
      transition: background .18s, color .18s, transform .12s;
      align-self: flex-start;
    }

    .wlc-start-btn:hover {
      background: transparent;
      color: var(--fg);
      transform: translateY(-1px);
    }

    .wlc-start-btn:active {
      transform: translateY(0);
    }

    .wlc-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: -1rem;
    }

    /* ── RESPONSIVE ────────────────────── */
    @media (max-width: 700px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .main {
        height: auto;
        overflow-y: visible;
      }

      .main-inner {
        padding: 2rem 1.2rem;
      }
    }
    /* ── SIGN-IN MODAL ────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border: 1px solid var(--border);
      padding: 2.5rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      font-family: var(--mono);
    }
    .modal h2 { font-size:1.2rem; margin-bottom: 0.8rem; }
    .modal p  { font-size:12px; color:var(--muted); line-height:1.7; margin-bottom:1.5rem; }
    .google-btn {
      display: flex; align-items: center; justify-content: center; gap:10px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 10px 20px;
      width: 100%;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      transition: background .15s;
    }
    .google-btn:hover { background: var(--card-bg); }
    .google-btn img { width: 18px; height: 18px; }
    .modal-close {
      margin-top:12px;
      background:none;
      border:none;
      font-family:var(--mono);
      font-size:11px;
      color:var(--muted);
      cursor:pointer;
      text-decoration:underline;
    }
    #signin-status {
      font-size:11px;
      margin-top:12px;
      color: var(--green);
      min-height:16px;
    }

    /* ── LEADERBOARD-STYLE TABLE (reused on welcome) ── */
    .lb-table {
      width: 100%; border-collapse: collapse;
      border: 1px solid var(--border);
    }
    .lb-table thead tr {
      background: var(--card-bg);
      border-bottom: 2px solid var(--border);
    }
    .lb-table th {
      padding: 12px 16px;
      font-size: 10px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      text-align: left; color: var(--muted);
    }
    .lb-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }
    .lb-table tbody tr:hover { background: var(--hover-bg); }
    .lb-table tbody tr:last-child { border-bottom: none; }
    .lb-table td {
      padding: 14px 16px;
      font-size: 12px; vertical-align: middle;
    }
    .rank-cell {
      font-size: 14px; font-weight: 700; width: 44px;
      text-align: center;
    }
    .pts-cell {
      font-size: 16px; font-weight: 700;
      text-align: right;
    }
    .solved-cell { text-align: center; }
    .solved-badge {
      display: inline-block;
      padding: 2px 10px;
      border: 1px solid var(--border);
      font-size: 10px; font-weight: 700;
      letter-spacing: .06em;
    }

    /* ── STATS STRIP (matches leaderboard) ─────────── */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .stat-cell {
      background: var(--bg);
      padding: 1.4rem 1.2rem;
      text-align: center;
    }
    .stat-num {
      font-size: 1.6rem; font-weight: 700;
      letter-spacing: -.02em;
      display: block;
    }
    .stat-lbl {
      font-size: 10px; color: var(--muted);
      letter-spacing: .08em; text-transform: uppercase;
      margin-top: 4px; display: block;
    }
  </style>
</head>

<body>

  <!-- flag{n0_s3cr3ts_1n_html} -->

  <!-- ── SIGN-IN MODAL ─────────────────── -->
  <div class="modal-overlay" id="signin-modal">
    <div class="modal">
      <h2>Registration Required to Play</h2>
      <p>Please sign in with your Google account to register for NovaHack CTF. Once registered, you can unlock challenges, view hints, submit flags, and track your rank on the live leaderboard.</p>
      <button class="google-btn" id="google-signin-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
        Sign in with Google to Register & Play
      </button>
      <div id="signin-status"></div>
    </div>
  </div>

  <!-- ── HEADER (shared) ────────────────── -->
  <div id="site-header"></div>

  <div class="layout">

    <!-- ── SIDEBAR ──────────────────────── -->
    <aside class="sidebar">
      <div id="sidebar-list">
        <!-- populated by JS -->
      </div>
    </aside>

    <!-- ── MAIN ─────────────────────────── -->
    <main class="main" id="main-panel">
      <div class="main-inner" id="content-area">
        <!-- welcome or challenge view rendered here -->
      </div>
    </main>

  </div>

  <!-- ── FIREBASE SDK ──────────────────── -->
  <script src="../shared.js"></script>
  <script type="module">
    await loadShared('../');
    const ext = document.getElementById('ctf-nav-extension');
    if (ext) {
      ext.innerHTML = `
        <span class="score-display">Score: <span id="total-score">0</span> pts</span>
        <span id="solved-count" style="color:var(--muted); font-size:12px;">0/10 solved</span>
      `;
      ext.style.display = 'flex';
      const navCta = document.querySelector('.nav-cta');
      if (navCta) navCta.style.display = 'none';
    }
    if (window.updateScoreBar) window.updateScoreBar();

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, serverTimestamp, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAk_YmDpbaedj-McM2K7ALUqkJyIJBKcfM",
      authDomain: "taskflow-e7f24.firebaseapp.com",
      projectId: "taskflow-e7f24",
      storageBucket: "taskflow-e7f24.firebasestorage.app",
      messagingSenderId: "431732571375",
      appId: "1:431732571375:web:12a9a4ce049fb7e779af1a",
      measurementId: "G-5TTKVGX9DM"
    };

    const app   = initializeApp(firebaseConfig);
    const auth  = getAuth(app);
    const db    = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // undefined = auth not yet resolved | null = resolved, not signed in | object = signed in
    let currentUser = undefined;
    let authReady   = false;

    // ── Google Sign-in ──────────────────────────────────
    document.getElementById("google-signin-btn").addEventListener("click", async () => {
      const status = document.getElementById("signin-status");
      status.textContent = "Signing in…";
      try {
        const result = await signInWithPopup(auth, provider);
        status.textContent = `✓ Registered & Signed in as ${result.user.displayName}`;
        setTimeout(() => closeModal(), 1000);
      } catch (e) {
        status.textContent = "Sign-in failed. Try again.";
      }
    });

    function closeModal() {
      const m = document.getElementById("signin-modal");
      if (m) m.classList.remove("open");
    }

    // Expose auth helpers — undefined means auth not yet resolved
    window.__getCurrentUser     = () => currentUser;
    window.__isAuthReady        = () => authReady;
    window.__promptRegistration = () => {
      const m = document.getElementById("signin-modal");
      if (m) m.classList.add("open");
    };

    // ── Load user's saved hints + solves from Firebase ────────────
    async function loadUserState(user) {
      try {
        const userRef = doc(db, "ctf_leaderboard", user.uid);
        const snap    = await getDoc(userRef);
        if (!snap.exists()) return;
        const data = snap.data();

        // Merge Firebase solves into local state
        (data.solves || []).forEach(s => {
          if (!STATE.solved[s.id]) STATE.solved[s.id] = true;
        });

        // Merge Firebase hintsUsed into local state
        const fbHints = data.hintsUsed || {};
        Object.entries(fbHints).forEach(([chId, arr]) => {
          const id = Number(chId);
          if (!STATE.hints[id]) STATE.hints[id] = [];
          arr.forEach(h => { if (!STATE.hints[id].includes(h)) STATE.hints[id].push(h); });
        });

        saveState();
        updateScoreBar();
        buildSidebar();
        // Refresh welcome screen if currently visible
        if (!STATE.current) showWelcome();
      } catch(e) {
        console.warn("loadUserState failed:", e);
      }
    }

    // ── Save a hint usage to Firebase ────────────────────────────
    window.__saveHintToFirebase = async (chId, hintIdx) => {
      if (!currentUser) return;
      try {
        const userRef = doc(db, "ctf_leaderboard", currentUser.uid);
        const snap    = await getDoc(userRef);
        const base = {
          uid: currentUser.uid, name: currentUser.displayName,
          email: currentUser.email, photo: currentUser.photoURL,
          totalPoints: 0, solvedCount: 0, solves: [], hintsUsed: {}
        };
        const data = snap.exists() ? snap.data() : base;
        const fbHints = data.hintsUsed || {};
        if (!fbHints[chId]) fbHints[chId] = [];
        if (!fbHints[chId].includes(hintIdx)) {
          fbHints[chId].push(hintIdx);
          if (snap.exists()) {
            await updateDoc(userRef, { hintsUsed: fbHints, lastUpdated: serverTimestamp() });
          } else {
            await setDoc(userRef, { ...base, hintsUsed: fbHints, lastUpdated: serverTimestamp() });
          }
        }
      } catch(e) {
        console.warn("saveHintToFirebase failed:", e);
      }
    };

    onAuthStateChanged(auth, user => {
      const firstResolution = !authReady;
      authReady   = true;
      currentUser = user;   // null = signed out, object = signed in

      if (user) {
        closeModal();
        // Show user avatar in nav
        const extNav = document.getElementById('ctf-nav-extension');
        if (extNav) {
          let badge = document.getElementById("user-badge");
          if (!badge) {
            badge = document.createElement("span");
            badge.id = "user-badge";
            badge.style.cssText = "font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;";
            extNav.insertBefore(badge, extNav.firstChild);
          }
          badge.innerHTML = `<img src="${user.photoURL}" style="width:20px;height:20px;border-radius:50%;" /> ${user.displayName.split(' ')[0]}`;
        }
        // Sync Firebase state (hints + solves) into local STATE
        loadUserState(user);
      } else if (firstResolution) {
        // Auth resolved → not signed in → mandatory registration
        window.__promptRegistration();
      }
    });

    // Record a correct submission to Firestore
    window.__recordSubmission = async (challengeId, challengeTitle, points, attempts) => {
      if (!currentUser) return;
      try {
        const uid   = currentUser.uid;
        const email = currentUser.email;
        const name  = currentUser.displayName;
        const photo = currentUser.photoURL;
        const userRef = doc(db, "ctf_leaderboard", uid);
        const snap    = await getDoc(userRef);
        if (!snap.exists()) {
          await setDoc(userRef, {
            uid, name, email, photo,
            totalPoints: points, solvedCount: 1,
            solves: [{ id: challengeId, title: challengeTitle, points, attempts, solvedAt: new Date().toISOString() }],
            hintsUsed: {}, lastUpdated: serverTimestamp()
          });
        } else {
          const data = snap.data();
          const alreadySolved = (data.solves || []).some(s => s.id === challengeId);
          if (!alreadySolved) {
            await updateDoc(userRef, {
              totalPoints: increment(points), solvedCount: increment(1),
              solves: [...(data.solves || []), { id: challengeId, title: challengeTitle, points, attempts, solvedAt: new Date().toISOString() }],
              lastUpdated: serverTimestamp()
            });
          }
        }
      } catch(e) {
        console.warn("Leaderboard write failed:", e);
      }
    };
  </script>

  <script src="challenges.js"></script>
  <audio id="bg-audio" src="../assets/Neural%20Surge.mp3" loop autoplay></audio>
  <script>
    // Attempt to auto-play audio (browsers may require interaction)
    document.body.addEventListener('click', () => {
      const audio = document.getElementById('bg-audio');
      if (audio.paused) audio.play();
    }, { once: true });

    // ── State ──────────────────────────────────────────────────────
    const STATE = {
      solved: JSON.parse(localStorage.getItem("cs2_solved") || "{}"),
      hints: JSON.parse(localStorage.getItem("cs2_hints") || "{}"),
      current: null,
    };

    function saveState() {
      localStorage.setItem("cs2_solved", JSON.stringify(STATE.solved));
      localStorage.setItem("cs2_hints", JSON.stringify(STATE.hints));
    }

    function totalScore() {
      return CHALLENGES.reduce((sum, ch) => {
        if (!STATE.solved[ch.id]) return sum;
        const hUsed = (STATE.hints[ch.id] || []).length;
        return sum + Math.max(0, ch.points - hUsed * 10);
      }, 0);
    }

    // ── SHA-256 helper (async, built-in Web Crypto) ─────────────────
    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // ── Sidebar ────────────────────────────────────────────────────
    const CATEGORIES = [...new Set(CHALLENGES.map(c => c.category))];

    function buildSidebar() {
      const list = document.getElementById("sidebar-list");
      if (!list) return;
      list.innerHTML = "";

      CATEGORIES.forEach(cat => {
        const chs = CHALLENGES.filter(c => c.category === cat);
        const wrap = document.createElement("div");
        wrap.className = "sidebar-section";
        wrap.innerHTML = `<p class="sidebar-label">${cat}</p>`;
        chs.forEach(ch => {
          const div = document.createElement("div");
          div.className = `ch-item${STATE.solved[ch.id] ? " solved" : ""}${STATE.current === ch.id ? " active" : ""}`;
          div.id = `sb-${ch.id}`;
          div.innerHTML = `
        <span class="ch-dot"></span>
        <span>${ch.title}</span>
        <span class="ch-pts">${ch.points}p</span>`;
          div.onclick = () => showChallenge(ch.id);
          wrap.appendChild(div);
        });
        list.appendChild(wrap);
      });
    }

    // ── Score display ──────────────────────────────────────────────
    function updateScoreBar() {
      const scoreEl = document.getElementById("total-score");
      const countEl = document.getElementById("solved-count");
      if (scoreEl) scoreEl.textContent = totalScore();
      if (countEl) {
        const solvedN = Object.keys(STATE.solved).length;
        countEl.textContent = `${solvedN}/${CHALLENGES.length} solved`;
      }
    }
    window.updateScoreBar = updateScoreBar;

    function showWelcome() {
      const contentArea = document.getElementById("content-area");
      if (!contentArea) return;

      const solvedN = Object.keys(STATE.solved).length;
      const totalN  = CHALLENGES.length;
      const pct     = totalN ? Math.round((solvedN / totalN) * 100) : 0;
      const pts     = totalScore();
      const firstUnsolved = CHALLENGES.find(c => !STATE.solved[c.id]);

      // Build table rows
      const rows = CHALLENGES.map((ch, i) => {
        const isSolved  = !!STATE.solved[ch.id];
        const hintsUsed = (STATE.hints[ch.id] || []).length;
        const earnedPts = isSolved ? Math.max(0, ch.points - hintsUsed * 10) : ch.points;
        const diffLabel = ch.difficulty || (ch.points <= 50 ? 'Easy' : ch.points <= 100 ? 'Medium' : 'Hard');
        const diffColor = diffLabel === 'Easy' ? 'var(--green)' : diffLabel === 'Medium' ? 'var(--orange)' : 'var(--red)';

        return `
          <tr class="ch-row" onclick="showChallenge(${ch.id})" style="cursor:pointer;">
            <td class="rank-cell">${i + 1}</td>
            <td>
              <div style="font-weight:700;font-size:12px;margin-bottom:2px;">${ch.title}</div>
              <div style="font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;">${ch.category}</div>
            </td>
            <td style="text-align:center;">
              <span style="font-size:10px;font-weight:700;color:${diffColor};letter-spacing:.06em;text-transform:uppercase;">${diffLabel}</span>
            </td>
            <td class="pts-cell">${earnedPts}<span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:3px;">pts</span></td>
            <td class="solved-cell">
              ${isSolved
                ? `<span class="solved-badge" style="background:var(--green);color:#fff;border-color:var(--green);">✓ Solved</span>`
                : `<span class="solved-badge" style="color:var(--muted);">Unsolved</span>`}
              ${hintsUsed > 0 ? `<div style="font-size:9px;color:var(--muted);margin-top:3px;">${hintsUsed} hint${hintsUsed>1?'s':''} used</div>` : ''}
            </td>
          </tr>`;
      }).join('');

      contentArea.innerHTML = `
        <div class="wlc-root">

          <!-- Banner + typewriter -->
          <div class="wlc-banner">
            <span class="wlc-badge">LIVE</span>
            <span class="wlc-banner-text">NovaHack CTF — IEEE CS Nirma</span>
          </div>
          <div class="wlc-terminal" id="wlc-terminal" aria-live="polite">
            <span class="wlc-prompt">$&nbsp;</span><span id="wlc-typed"></span><span class="wlc-cursor">▌</span>
          </div>

          <!-- Stats strip (same style as leaderboard) -->
          <div class="stats-strip">
            <div class="stat-cell">
              <span class="stat-num">${totalN}</span>
              <span class="stat-lbl">Challenges</span>
            </div>
            <div class="stat-cell">
              <span class="stat-num">${solvedN}</span>
              <span class="stat-lbl">Solved</span>
            </div>
            <div class="stat-cell">
              <span class="stat-num">${pts}</span>
              <span class="stat-lbl">Your Points</span>
            </div>
            <div class="stat-cell">
              <span class="stat-num">${totalN - solvedN}</span>
              <span class="stat-lbl">Remaining</span>
            </div>
          </div>

          <!-- Progress bar -->
          <div class="wlc-prog-wrap">
            <div class="wlc-prog-bar">
              <div class="wlc-prog-fill" id="wlc-fill" style="width:0%"></div>
            </div>
            <div class="wlc-prog-meta">
              <span>${solvedN} / ${totalN} challenges solved</span>
              <span>${pct}%</span>
            </div>
          </div>

          <!-- Challenges table -->
          <table class="lb-table" id="ch-table">
            <thead>
              <tr>
                <th style="width:44px;">#</th>
                <th>Challenge</th>
                <th style="text-align:center;width:90px;">Difficulty</th>
                <th style="text-align:right;width:90px;">Points</th>
                <th style="text-align:center;width:110px;">Status</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>

          <!-- CTA -->
          <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;">
            <button class="wlc-start-btn" id="wlc-start-btn"
              ${firstUnsolved ? `onclick="showChallenge(${firstUnsolved.id})"` : ''}>
              ${solvedN === 0 ? 'Start Hacking →' : solvedN === totalN ? '🏁 All Solved!' : 'Continue Hacking →'}
            </button>
            <span style="font-size:11px;color:var(--muted);">or click any row above</span>
          </div>

        </div>`;

      // Animate progress fill
      requestAnimationFrame(() => {
        setTimeout(() => {
          const fill = document.getElementById("wlc-fill");
          if (fill) fill.style.width = pct + "%";
        }, 200);
      });

      // Typewriter
      const lines = ["welcome to NovaHack CTF arena", "10 challenges await. Are you ready?"];
      let lineIdx = 0, charIdx = 0;
      const typed = document.getElementById("wlc-typed");
      function type() {
        if (!typed) return;
        const line = lines[lineIdx];
        if (charIdx < line.length) {
          typed.textContent += line[charIdx++];
          setTimeout(type, 45);
        } else if (lineIdx < lines.length - 1) {
          setTimeout(() => { typed.textContent = ""; charIdx = 0; lineIdx++; type(); }, 1400);
        }
      }
      setTimeout(type, 400);
    }

    // ── Challenge view ──────────────────────────────────────────────
    // ── Helpers: auth-ready guard ────────────────────────────────
    function requireAuth() {
      // undefined = auth not resolved yet → allow (will gate once resolved)
      // null     = resolved, not signed in → block
      const u = window.__getCurrentUser ? window.__getCurrentUser() : undefined;
      if (u === null) {
        if (window.__promptRegistration) window.__promptRegistration();
        return false;
      }
      return true;
    }

    function showChallenge(id) {
      if (!requireAuth()) return;

      STATE.current = id;

      // Update sidebar active states
      document.querySelectorAll(".ch-item").forEach(el => el.classList.remove("active"));
      const sbEl = document.getElementById(`sb-${id}`);
      if (sbEl) sbEl.classList.add("active");

      // Scroll sidebar item into view
      if (sbEl) sbEl.scrollIntoView({ block: "nearest" });

      const ch = CHALLENGES.find(c => c.id === id);
      if (!ch) return;

      const isSolved = !!STATE.solved[ch.id];
      const usedHints = STATE.hints[ch.id] || [];
      const diffClass = { Easy: "easy", Medium: "medium", Hard: "hard" }[ch.difficulty] || "";

      // Build hint HTML
      const h1html = buildHintHtml(ch, 0, usedHints.includes(0));
      const h2html = buildHintHtml(ch, 1, usedHints.includes(1));

      // Script filename
      const fname = `solve_${String(ch.id).padStart(2, "0")}.py`;

      const contentArea = document.getElementById("content-area");
      if (!contentArea) return;

      contentArea.innerHTML = `
    <div class="ch-header">
      <div class="ch-eyebrow">
        <span class="ch-icon">${ch.icon}</span>
        <span>#${String(ch.id).padStart(2, "0")}</span>
        <span>·</span>
        <span>${ch.category}</span>
      </div>
      <h1 class="ch-title">${ch.title}</h1>
      <div class="ch-badges">
        <span class="badge ${diffClass}">${ch.difficulty}</span>
        <span class="badge">${ch.points} pts</span>
        <span class="badge">${ch.time}</span>
        ${isSolved ? `<span class="badge solved">✓ Solved</span>` : ""}
      </div>
    </div>

    <div class="block">
      <p class="block-title">Description</p>
      <p>${ch.description}</p>
      ${ch.attachment ? `<a href="../assets/challenges/${ch.attachment}" download class="download-btn">⇩ Download ${ch.attachment}</a>` : ""}
      ${ch.note ? `<p style="color:var(--muted);margin-top:12px;font-size:12px;border-left:3px solid var(--border);padding-left:12px">${ch.note}</p>` : ""}
    </div>

    <div class="block">
      <p class="block-title">Hints (click to reveal · 10 pts each)</p>
      ${h1html}
      ${h2html}
    </div>

    ${ch.guide ? `
    <div class="block">
      <p class="block-title">Objective & Overview</p>
      <div style="font-size:13px;line-height:1.75;color:var(--fg);background:var(--card-bg);border:1px solid var(--border);padding:1.2rem;">
        ${renderMarkdown(ch.guide)}
      </div>
    </div>
    ` : ""}

    ${ch.script ? `
    <div class="block">
      <p class="block-title">${ch.category === 'Debug & Fix' ? 'Buggy Code Template — ' + fname : 'Starter Code Snippet — ' + fname}</p>
      <div class="code-wrap">
        <div class="code-topbar">
          <span class="code-filename">${fname}</span>
          <button class="copy-btn" id="copy-btn">Copy</button>
        </div>
        <pre><code id="code-block">${escHtml(ch.script)}</code></pre>
      </div>
    </div>
    ` : ""}

    <div class="flag-section">
      <p class="flag-title">Submit Flag</p>
      <p style="font-size:12px;color:var(--muted);margin-bottom:1rem">
        Format: <code>flag{...}</code>
      </p>
      ${isSolved ? `<div class="solved-badge" style="margin-bottom:0.8rem;display:inline-block;">✓ Correctly solved — ${ch.points} pts</div>` : ""}
      <div class="flag-row">
        <input class="flag-input" id="flag-input" type="text" placeholder="flag{...}" autocomplete="off" spellcheck="false" />
        <button class="submit-btn" id="submit-btn">${isSolved ? 'Verify Again' : 'Submit'}</button>
      </div>
      <div class="flag-result" id="flag-result"></div>
    </div>
  `;

      // Wire up events
      const copyBtn = document.getElementById("copy-btn");
      if (copyBtn) {
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(ch.script).then(() => {
            copyBtn.textContent = "Copied!";
            setTimeout(() => { if (copyBtn) copyBtn.textContent = "Copy"; }, 2000);
          });
        };
      }

      document.getElementById("submit-btn").onclick = () => submitFlag(ch.id);
      document.getElementById("flag-input").addEventListener("keydown", e => {
        if (e.key === "Enter") submitFlag(ch.id);
      });

      // Hint toggles — onclick only, initial state already in HTML via buildHintHtml
      [0, 1].forEach(i => {
        const card = document.getElementById(`hint-${ch.id}-${i}`);
        if (!card) return;
        card.onclick = (e) => {
          e.stopPropagation();
          revealHint(ch.id, i);
        };
      });


      // Handle URL hash
      window.location.hash = `ch-${ch.id}`;
    }

    function buildHintHtml(ch, idx, revealed) {
      const hintText = idx === 0 ? ch.hint1 : ch.hint2;
      const costLabel = revealed
        ? '<span style="color:var(--orange);">unlocked · -10 pts</span>'
        : '(-10 pts to unlock)';
      return `
    <div class="hint-card${revealed ? " revealed" : ""}" id="hint-${ch.id}-${idx}">
      <div class="hint-header">
        <span>
          <span class="hint-label">Hint ${idx + 1}</span>
          <span class="hint-cost">${costLabel}</span>
        </span>
        <span class="hint-arrow">▼</span>
      </div>
      <div class="hint-body">${hintText}</div>
    </div>`;
    }

    function revealHint(chId, idx) {
      if (!requireAuth()) return;

      const card = document.getElementById(`hint-${chId}-${idx}`);
      if (!card) return;

      const hints = STATE.hints[chId] || [];
      const alreadyUsed = hints.includes(idx);

      if (!alreadyUsed) {
        // First time: deduct points, persist, always open
        hints.push(idx);
        STATE.hints[chId] = hints;
        saveState();
        updateScoreBar();
        card.classList.add("revealed");
        // Update cost label to show unlocked state
        const costEl = card.querySelector('.hint-cost');
        if (costEl) costEl.innerHTML = '<span style="color:var(--orange);">unlocked · -10 pts</span>';
        // Persist to Firebase
        if (window.__saveHintToFirebase) window.__saveHintToFirebase(chId, idx);
      } else {
        // Already unlocked: just toggle open/close
        card.classList.toggle("revealed");
      }
    }

    // ── Flag submission ─────────────────────────────────────────────
    async function submitFlag(chId) {
      if (!requireAuth()) return;

      const input = document.getElementById("flag-input");
      const result = document.getElementById("flag-result");
      if (!input || !result) return;

      const val = input.value.trim();
      if (!val) return;

      const ch = CHALLENGES.find(c => c.id === chId);
      if (!ch) return;

      // Validate format
      if (!/^flag\{[^}]+\}$/.test(val)) {
        result.className = "flag-result wrong";
        result.style.display = "block";
        result.textContent = "Invalid format. Flags look like: flag{...}";
        return;
      }

      result.className = "flag-result";
      result.style.display = "block";
      result.textContent = "Checking…";

      const hash = await sha256(val);

      // Track attempts per challenge
      STATE.attempts = STATE.attempts || {};
      STATE.attempts[chId] = (STATE.attempts[chId] || 0) + 1;

      if (hash === ch.flagHash) {
        const attempts = STATE.attempts[chId];
        STATE.solved[chId] = true;
        saveState();
        updateScoreBar();
        buildSidebar();
        result.className = "flag-result correct";
        result.textContent = `✓ Correct! +${ch.points} pts`;
        // Record to Firebase leaderboard if signed in
        if (window.__recordSubmission) window.__recordSubmission(ch.id, ch.title, ch.points, attempts);
        // Re-render after brief pause to show checkmark
        setTimeout(() => showChallenge(chId), 900);
      } else {
        result.className = "flag-result wrong";
        result.textContent = "✗ Incorrect flag. Try again.";
        input.select();
      }
    }

    // ── Escape HTML ─────────────────────────────────────────────────
    function escHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMarkdown(md) {
      if (!md) return "";
      return md
        .replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) => `<div class="code-wrap" style="margin:12px 0"><div class="code-topbar"><span class="code-filename">${lang || 'code'}</span></div><pre><code>${escHtml(code.trim())}</code></pre></div>`)
        .replace(/### (.*?)\n/g, '<h4 style="font-size:13px;font-weight:700;margin:12px 0 6px">$1</h4>')
        .replace(/#### (.*?)\n/g, '<h5 style="font-size:12px;font-weight:700;margin:10px 0 4px">$1</h5>')
        .replace(/`([^`]+)`/g, '<code style="background:var(--border);padding:2px 6px;font-size:12px">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--fg);text-decoration:underline">$1</a>')
        .replace(/\n\n/g, '<br/><br/>');
    }

    // ── Init ────────────────────────────────────────────────────────
    buildSidebar();
    updateScoreBar();

    // Route from URL hash
    const hashId = parseInt((window.location.hash || "").replace("#ch-", ""));
    if (hashId && CHALLENGES.find(c => c.id === hashId)) {
      showChallenge(hashId);
    } else {
      showWelcome();
    }

    // Handle hash navigation (from index.html cards)
    window.addEventListener("hashchange", () => {
      const id = parseInt(window.location.hash.replace("#ch-", ""));
      if (id && CHALLENGES.find(c => c.id === id)) showChallenge(id);
    });

    // Reset button (hold Alt and double click score for reset — dev convenience)
    const scoreResetBtn = document.getElementById("total-score");
    if (scoreResetBtn) {
      scoreResetBtn.addEventListener("dblclick", () => {
        if (confirm("Reset all progress?")) {
          localStorage.removeItem("cs2_solved");
          localStorage.removeItem("cs2_hints");
          location.reload();
        }
      });
    }
  </script>
