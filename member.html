  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --border: #dddddd;
      --card-bg: #fafafa;
      --orange: #FFA300;
      --gold: #D4AF37;
      --gold-bg: #fffdf5;
      --mono: 'Space Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--mono); background: var(--bg); color: var(--fg); font-size: 13px; line-height: 1.65; }

    .section { max-width: 900px; margin: 0 auto; padding: 4rem 2rem 6rem; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--muted); text-decoration: none; margin-bottom: 2rem; }
    .back-link:hover { color: var(--fg); }

    .profile-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 2.5rem; display: flex; gap: 2.5rem; align-items: flex-start; margin-bottom: 3.5rem; }
    @media (max-width: 600px) { .profile-card { flex-direction: column; align-items: center; text-align: center; } }

    .profile-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; flex-shrink: 0; }
    .profile-avatar-icon { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; background: #eee; color: var(--muted); font-size: 64px; flex-shrink: 0; }

    .profile-details { flex-grow: 1; }
    .gold-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8a6d0b; background: var(--gold-bg); border: 1px solid var(--gold); padding: 2px 8px; border-radius: 3px; margin-bottom: 0.8rem; }

    .profile-name { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 0.2rem; }
    .profile-role { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); font-weight: 700; margin-bottom: 1rem; }
    .profile-bio { font-size: 13px; color: var(--muted); line-height: 1.8; margin-bottom: 1.5rem; }

    .profile-links { display: flex; gap: 12px; flex-wrap: wrap; }
    .profile-link-btn { font-size: 11px; font-weight: 700; color: var(--fg); text-decoration: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; background: var(--bg); transition: all .2s; }
    .profile-link-btn:hover { border-color: var(--fg); background: var(--fg); color: var(--bg); }

    .achievements-section-title { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: baseline; }

    .achievement-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .achievement-item-date { font-size: 10px; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 0.3rem; }
    .achievement-item-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.6rem; }
    .achievement-item-desc { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 1rem; }

    .no-achievements { padding: 2rem; text-align: center; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="section">
    <a class="back-link" href="/team">← Back to Team</a>
    <div id="member-profile-container">Loading member profile…</div>

    <div class="achievements-section-title">
      <span>Filtered Member Achievements</span>
      <span style="font-size: 11px; color: var(--muted);" id="filtered-count">0 achievements</span>
    </div>
    <div id="member-achievements-container"></div>
  </main>

  <div id="site-footer"></div>

  <script>
    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadMemberProfile() {
      const params = new URLSearchParams(window.location.search);
      const memberId = params.get('id');

      const profileContainer = document.getElementById('member-profile-container');
      const achievementsContainer = document.getElementById('member-achievements-container');
      const filteredCount = document.getElementById('filtered-count');

      if (!memberId) {
        profileContainer.innerHTML = `<div class="no-achievements">No member ID specified. <a href="/team" style="color:var(--fg);">View all team members</a>.</div>`;
        achievementsContainer.innerHTML = '';
        return;
      }

      try {
        const [teamRes, achRes] = await Promise.all([
          fetch('data/team.json'),
          fetch('data/achievements.json')
        ]);
        const teamData = await teamRes.json();
        const achievementsData = await achRes.json();

        let member = null;
        let categoryName = 'Board Member';

        (teamData || []).forEach(cat => {
          (cat.members || []).forEach(m => {
            if (m.id === memberId) {
              member = m;
              categoryName = cat.category || 'Board Member';
            }
          });
        });

        if (!member) {
          profileContainer.innerHTML = `<div class="no-achievements">Board member with ID "<strong>${esc(memberId)}</strong>" not found. <a href="/team" style="color:var(--fg);">Back to Team</a>.</div>`;
          achievementsContainer.innerHTML = '';
          return;
        }

        // Update document title
        document.title = `${member.name} — ${member.role} | IEEE CS Nirma`;

        // Render Profile
        const avatarHtml = (member.image || member.photo)
          ? `<img class="profile-avatar" src="${esc(member.image || member.photo)}" alt="${esc(member.name)}" onerror="this.outerHTML='<div class=\\'profile-avatar-icon\\'><span class=\\'material-symbols-outlined\\'>account_circle</span></div>'" />`
          : `<div class="profile-avatar-icon"><span class="material-symbols-outlined">account_circle</span></div>`;

        profileContainer.innerHTML = `
          <div class="profile-card">
            ${avatarHtml}
            <div class="profile-details">
              <span class="gold-badge">★ ${esc(categoryName)}</span>
              <h1 class="profile-name">${esc(member.name)}</h1>
              <p class="profile-role">${esc(member.role)}</p>
              ${member.bio ? `<p class="profile-bio">"${esc(member.bio)}"</p>` : ''}
              <div class="profile-links">
                ${member.github ? `<a class="profile-link-btn" href="${esc(member.github)}" target="_blank" rel="noopener">GitHub ↗</a>` : ''}
                ${member.linkedin ? `<a class="profile-link-btn" href="${esc(member.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : ''}
                ${member.website ? `<a class="profile-link-btn" href="${esc(member.website)}" target="_blank" rel="noopener">Website ↗</a>` : ''}
              </div>
            </div>
          </div>
        `;

        // Filter achievements
        const userAchievements = (achievementsData || []).filter(item => {
          return (item.contributors || []).some(c => c.id === memberId);
        });

        filteredCount.textContent = `${userAchievements.length} achievement${userAchievements.length !== 1 ? 's' : ''}`;

        if (!userAchievements.length) {
          achievementsContainer.innerHTML = `<div class="no-achievements">No specific achievements linked to ${esc(member.name)} yet.</div>`;
          return;
        }

        achievementsContainer.innerHTML = userAchievements.map(item => `
          <article class="achievement-item">
            <p class="achievement-item-date">✦ ${esc(item.date)}</p>
            <h2 class="achievement-item-title">${esc(item.title)}</h2>
            <p class="achievement-item-desc">${esc(item.description)}</p>
            ${(item.links && item.links.length) ? `
              <div class="profile-links">
                ${item.links.map(l => `<a class="profile-link-btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}
              </div>
            ` : ''}
          </article>
        `).join('');

      } catch (e) {
        profileContainer.innerHTML = '<p style="color:var(--muted)">Failed to load member profile.</p>';
      }
    }

    loadMemberProfile();
  </script>
  <script src="shared.js"></script>
  <script>loadShared('');</script>
</body>

</html>
