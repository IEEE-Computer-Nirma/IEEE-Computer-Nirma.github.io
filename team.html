  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --border: #dddddd;
      --card-bg: #fafafa;
      --hover-bg: #f4f4f4;
      --orange: #FFA300;
      --mono: 'Space Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--mono); background: var(--bg); color: var(--fg); font-size: 13px; line-height: 1.65; }

    .section { max-width: 1100px; margin: 0 auto; padding: 4rem 2rem 6rem; }
    .section-header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    .section-label { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; }
    .section-sub { font-size: 12px; color: var(--muted); }

    .team-category { margin-bottom: 3.5rem; text-align: center; }
    .team-category-title {
      font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); font-weight: 700;
      margin-bottom: 1.5rem; padding-bottom: 8px; border-bottom: 1px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    }
    .team-category-title::before { content: '✦'; color: var(--orange); }

    .team-category-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; }

    .team-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 1.8rem 1.2rem;
      display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center;
      min-height: 220px; flex: 0 1 calc(33.333% - 1rem); min-width: 260px; max-width: 340px; width: 100%;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .team-card:hover { border-color: var(--fg); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }

    .team-avatar { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--border); margin-bottom: 1rem; object-fit: cover; }
    .team-avatar-icon { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--border); margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; background: var(--hover-bg); color: var(--muted); font-size: 38px; }

    .team-name-link { font-size: 16px; font-weight: 700; color: var(--fg); text-decoration: none; border-bottom: 1px dotted var(--orange); transition: color .2s; }
    .team-name-link:hover { color: var(--orange); }

    .team-role { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); font-weight: 700; margin-top: 4px; }
    .team-bio { font-size: 12px; color: var(--muted); line-height: 1.65; margin-top: 0.4rem; }

    .team-links { display: flex; justify-content: center; gap: 12px; margin-top: 0.8rem; padding-top: 0.8rem; width: 100%; border-top: 1px solid var(--border); }
    .team-links a { font-size: 11px; font-weight: 700; color: var(--muted); text-decoration: none; }
    .team-links a:hover { color: var(--fg); }

    .profile-btn { margin-top: 0.8rem; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; padding: 4px 10px; border: 1px solid var(--orange); color: var(--orange); text-decoration: none; border-radius: 3px; font-weight: 700; }
    .profile-btn:hover { background: var(--orange); color: #000; }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="section-header">
      <span class="section-label">Board & Team Members</span>
      <span class="section-sub" id="team-count">Loading…</span>
    </div>
    <div id="team-container"></div>
  </main>

  <div id="site-footer"></div>

  <script>
    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function memberCard(m) {
      const avatarHtml = (m.image || m.photo)
        ? `<img class="team-avatar" src="${esc(m.image || m.photo)}" alt="${esc(m.name)}" loading="lazy" onerror="this.outerHTML='<div class=\\'team-avatar-icon\\'><span class=\\'material-symbols-outlined\\'>account_circle</span></div>'" />`
        : `<div class="team-avatar-icon"><span class="material-symbols-outlined">account_circle</span></div>`;

      const profileUrl = `/member?id=${encodeURIComponent(m.id)}`;

      return `
        <div class="team-card" id="${esc(m.id)}">
          ${avatarHtml}
          <a class="team-name-link" href="${profileUrl}">${esc(m.name)}</a>
          <p class="team-role">${esc(m.role)}</p>
          ${m.bio ? `<p class="team-bio">"${esc(m.bio)}"</p>` : ''}
          <a class="profile-btn" href="${profileUrl}">View Profile & Achievements →</a>
          ${(m.github || m.linkedin || m.website) ? `
            <div class="team-links">
              ${m.github ? `<a href="${esc(m.github)}" target="_blank">GitHub</a>` : ''}
              ${m.linkedin ? `<a href="${esc(m.linkedin)}" target="_blank">LinkedIn</a>` : ''}
              ${m.website ? `<a href="${esc(m.website)}" target="_blank">Website</a>` : ''}
            </div>` : ''}
        </div>`;
    }

    async function loadTeam() {
      try {
        const res = await fetch('data/team.json');
        const team = await res.json();
        const container = document.getElementById('team-container');
        const count = document.getElementById('team-count');

        let total = 0;
        team.forEach(c => { total += (c.members ? c.members.length : 0); });
        count.textContent = `${total} member${total !== 1 ? 's' : ''}`;

        container.innerHTML = team.map(cat => `
          <div class="team-category">
            <h3 class="team-category-title">${esc(cat.category)}</h3>
            <div class="team-category-grid">${(cat.members || []).map(memberCard).join('')}</div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('team-container').innerHTML = '<p style="color:var(--muted)">Failed to load team data.</p>';
      }
    }

    loadTeam();
  </script>
  <script src="shared.js"></script>
  <script>loadShared('');</script>
</body>
